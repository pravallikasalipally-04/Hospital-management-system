{% extends 'base.html' %}{% block title %}{{ 'Edit' if appointment else 'Schedule' }} Appointment{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body"><h2>{{ 'Edit' if appointment else 'Schedule' }} Appointment</h2><form method="post" action="{{ action }}"><input type="hidden" name="_method" value="PUT"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Patient</label><select name="patient_id" class="form-select" required>{% for p in patients %}<option value="{{ p.id }}" {{ 'selected' if appointment and appointment.patient_id==p.id else '' }}>{{ p.id }} - {{ p.name }}</option>{% endfor %}</select></div><div class="col-md-6 mb-3"><label class="form-label">Doctor</label><select name="doctor_id" class="form-select" required>{% for d in doctors %}<option value="{{ d.id }}" {{ 'selected' if appointment and appointment.doctor_id==d.id else '' }}>{{ d.id }} - {{ d.name }} ({{ d.specialization }})</option>{% endfor %}</select></div></div><div class="mb-3"><label class="form-label">Date & Time</label><input type="datetime-local" name="date" class="form-control" value="{{ appointment.date.strftime('%Y-%m-%dT%H:%M') if appointment else '' }}" required></div><div class="mb-3"><label class="form-label">Diagnosis</label><input name="diagnosis" class="form-control" value="{{ appointment.diagnosis if appointment else '' }}" required></div><div class="mb-3"><label class="form-label">Status</label><select name="status" class="form-select">{% for s in ['Recovered','Under Treatment','Critical'] %}<option {{ 'selected' if appointment and appointment.status==s else '' }}>{{ s }}</option>{% endfor %}</select></div><button class="btn btn-primary">Save Appointment</button> <a class="btn btn-secondary" href="{{ url_for('appointments') }}">Cancel</a></form></div></div></div></div>{% endblock %}
