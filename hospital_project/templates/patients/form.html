{% extends 'base.html' %}{% block title %}{{ 'Edit' if patient else 'Add' }} Patient{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body"><h2>{{ 'Edit' if patient else 'Add' }} Patient</h2><form method="post" action="{{ action }}"><input type="hidden" name="_method" value="PUT"> <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ patient.name if patient else form.name if form else '' }}" required></div><div class="mb-3"><label class="form-label">Age</label><input class="form-control" type="number" min="0" max="120" name="age" value="{{ patient.age if patient else form.age if form else '' }}" required></div><div class="mb-3"><label class="form-label">Gender</label><select class="form-select" name="gender" required>{% for g in ['Male','Female','Other'] %}<option {{ 'selected' if patient and patient.gender==g else '' }}>{{ g }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Contact</label><input class="form-control" name="contact" value="{{ patient.contact if patient else form.contact if form else '' }}" required></div><button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="{{ url_for('patients') }}">Cancel</a></form></div></div></div></div>{% endblock %}
