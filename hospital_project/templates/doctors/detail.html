{% extends 'base.html' %}{% block title %}Doctor Details{% endblock %}{% block content %}<div class="card shadow-sm"><div class="card-body"><h2>{{ doctor.name }}</h2><p><b>ID:</b> {{ doctor.id }}</p><p><b>Specialization:</b> {{ doctor.specialization }}</p><a class="btn btn-secondary" href="{{ url_for('doctors') }}">Back</a>{% if logged_user and logged_user.role=='admin' %}<a class="btn btn-primary" href="{{ url_for('edit_doctor', doctor_id=doctor.id) }}">Edit</a>{% endif %}</div></div>{% endblock %}
