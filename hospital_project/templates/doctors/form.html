{% extends 'base.html' %}{% block title %}{{ 'Edit' if doctor else 'Add' }} Doctor{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body"><h2>{{ 'Edit' if doctor else 'Add' }} Doctor</h2><form method="post" action="{{ action }}"><input type="hidden" name="_method" value="PUT"><div class="mb-3"><label class="form-label">Doctor Name</label><input class="form-control" name="name" value="{{ doctor.name if doctor else '' }}" required></div><div class="mb-3"><label class="form-label">Specialization</label><input class="form-control" name="specialization" value="{{ doctor.specialization if doctor else '' }}" required></div><button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="{{ url_for('doctors') }}">Cancel</a></form></div></div></div></div>{% endblock %}
